[workspace]
members = [
    "crates/lib/observation",
    "crates/lib/observation-macros",
    "crates/lib/domain",
    "crates/lib/application",
    "crates/lib/infrastructure/gitlab-adapter",
    "crates/lib/infrastructure/json-adapter",
    "crates/lib/infrastructure/filesystem-adapter",
    "crates/lib/infrastructure/json2md-adapter",
    "crates/bin/cli",
]
resolver = "3"

[workspace.package]
version = "0.1.2"
edition = "2024"
rust-version = "1.98"
publish = false
repository = "https://github.com/sformisano/review-kit"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27"
httpmock = { version = "0.8.3", default-features = false }
testcontainers = { version = "0.28", default-features = false, features = ["blocking"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "query", "rustls"] }
derive_more = { version = "2.1", default-features = false, features = ["debug"] }
displaydoc = "0.2"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redactable = { version = "0.14", features = ["slog"] }
slog = { version = "2.8", features = ["nested-values"] }
slog-json = { version = "2.6", features = ["nested-values"] }
uuid = { version = "1", features = ["v4"] }
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full", "visit"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
